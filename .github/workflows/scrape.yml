name: Scraping StreamingCommunity (Film e Serie TV)

on:
  schedule:
    - cron: '0 */6 * * *'   # Ogni 6 ore
  workflow_dispatch:        # Esecuzione manuale

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Scraping film
        run: python scraper_movie.py

      - name: Scraping serie TV
        run: python scraper_tv.py

      - name: Scraping film popolari
        run: python scraper_movie_popular.py

      - name: Scraping serie TV popolari
        run: python scraper_tv_popular.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Aggiungi tutti i file JSON
          git add movies.json tv.json movies_popular.json tv_popular.json
          
          # Verifica se ci sono modifiche
          git diff --staged --quiet || git commit -m "Aggiornamento automatico film e serie TV"
          
          # Imposta il token per il push
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          
          # Pusha le modifiche
          git push

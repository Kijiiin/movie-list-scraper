name: Scraping StreamingCommunity (Film e Serie TV)

on:
  schedule:
    - cron: '0 */6 * * *'   # Ogni 6 ore
  workflow_dispatch:        # Esecuzione manuale

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      # 1. Esegui lo scraper per i FILM (ultimi usciti)
      - name: Scraping film
        run: python scraper_movie.py

      # 2. Esegui lo scraper per le SERIE TV (ultimi usciti)
      - name: Scraping serie TV
        run: python scraper_tv.py

      # 3. Esegui lo scraper per i FILM POPOLARI
      - name: Scraping film popolari    
        run: python scraper_movie_popular.py

      # 4. Esegui lo scraper per le SERIE TV POPOLARI
      - name: Scraping serie TV popolari
        run: python scraper_tv_popular.py

      # 5. Salva (commit) TUTTI i file JSON se modificati
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 🔥 Aggiungi TUTTI e 4 i file JSON
          git add movies.json tv.json movies_popular.json tv_popular.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico film e serie TV"
          git push

name: Scraping StreamingCommunity (Film e Serie TV)

on:
  schedule:
    - cron: '0 */6 * * *'   # Ogni 6 ore
  workflow_dispatch:        # Esecuzione manuale

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      # 1. Esegui lo scraper per i FILM
      - name: Scraping film
        run: python scraper_movie.py

      # 2. Esegui lo scraper per le SERIE TV
      - name: Scraping serie TV
        run: python scraper_tv.py

      # 4. Aggiorna il dominio nel README prendendolo da config.py
      - name: Aggiorna Streaming Domain nel README
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          config = Path("config.py").read_text(encoding="utf-8")
          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          match = re.search(
              r'^\s*streaming_domain\s*=\s*["\']([^"\']+)["\']',
              config,
              re.MULTILINE
          )

          if not match:
              raise SystemExit("streaming_domain non trovato in config.py")

          domain = match.group(1)

          start = "<!-- STREAMING_DOMAIN -->"
          end = "<!-- /STREAMING_DOMAIN -->"

          replacement = f"{start}\n{domain}\n{end}"

          pattern = re.escape(start) + r".*?" + re.escape(end)

          new_readme, count = re.subn(
              pattern,
              replacement,
              readme,
              flags=re.DOTALL
          )

          if count == 0:
              raise SystemExit(
                  "Marcatori STREAMING_DOMAIN non trovati nel README.md"
              )

          readme_path.write_text(new_readme, encoding="utf-8")

          print(f"Streaming domain: {domain}")

      # 5. Salva (commit) entrambi i file JSON se modificati
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add movies.json tv.json README.md
          git diff --staged --quiet || git commit -m "Aggiornamento automatico film, serie TV e dominio"
          git push
